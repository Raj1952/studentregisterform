services:
  student-registration:
    build: .
    container_name: student-registration
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /app/data/students.db
      SECRET_KEY: ${SECRET_KEY:-change-this-before-deploying}
    volumes:
      - student-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  student-data: